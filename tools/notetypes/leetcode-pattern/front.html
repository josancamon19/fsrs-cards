<div class="lc">
  <section class="lc-desc">
    <div class="lc-body">{{Statement}}</div>
  </section>
  <section class="lc-pad">
    <pre class="lc-code"><code class="language-python">{{Starter}}</code></pre>
    <textarea id="pad" class="lc-input" spellcheck="false" autocapitalize="off" autocomplete="off"
      placeholder="# pattern: …&#10;# signal: what in the problem tells you&#10;# plan: …&#10;# O(?) time · O(?) space"></textarea>
    <div class="lc-ask">Out loud or typed: <b>pattern</b> · <b>signal</b> · <b>plan</b> · <b>complexity</b></div>
  </section>
</div>
